[project]
name = "eo-toolkit"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.7.50",
    "folium>=0.20.0",
    "geemap>=0.38.9",
    "geopandas>=1.2.0",
    "geoparquet>=0.0.3",
    "hydra-core>=1.3.8",
    "ipyleaflet>=0.20.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "odc-stac>=0.5.3",
    "pandas>=3.1.0",
    "planetary-computer>=1.0.0",
    "pymannkendall>=1.4.3",
    "pyproj>=3.8.0",
    "pystac-client>=0.9.1",
    "python-dotenv>=1.2.4",
    "rasterio>=1.5.2",
    "rioxarray>=0.23.0",
    "torch>=2.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

